# Personal, NON-rig tmux prefs only.
#
# The plugin stack (tpm + resurrect + continuum), `default-command "/bin/zsh -l"`
# (so .zprofile loads inside panes), continuum-restore, and the cc-save/cc-restore
# hooks are ALL owned by rig — see the single source-file at the bottom.
#
# Do NOT re-declare tpm/resurrect/continuum or run them here. The old version of
# this file did, and it double-initialised the stack: continuum-restore fired
# from this top block BEFORE rig set default-command, so restored panes spawned
# non-login (=> .zprofile skipped), and a stale `@continuum-boot on`/iterm fought
# rig's `@continuum-boot off`. rig owns the stack; this file only adds prefs,
# declares the one extra plugin rig doesn't (tmux-sensible), and sources rig last
# (rig runs tpm at its end, which picks up the @plugin declared below).

# Extra plugin rig doesn't manage. Declared here; rig's tpm (run last) loads it.
set -g @plugin 'tmux-plugins/tmux-sensible'

setw -g aggressive-resize off
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#I: #W"

# Restore vim/nvim sessions (rig doesn't manage this; harmless before init).
# rig-migrated (now in rig.tmux.conf): set -g @resurrect-strategy-vim 'session'

# Propagate MOSHI_CLIENT into new sessions. The status-line clear that uses it
# lives in rig.tmux.conf, deliberately ordered BEFORE continuum init so the
# autosave hook in status-right is not wiped.
set-option -ga update-environment " MOSHI_CLIENT"

# rig owns the plugin stack + login-shell default-command + continuum + cc-restore.
# MUST be last: rig.tmux.conf runs tpm at its end (tpm's contract).

# ── macOS clipboard (personal; AFTER rig/tpm so bindings win) ───────────────
set -g set-clipboard on

# Emacs copy-mode (current default: mode-keys emacs)
# ^b [ workflow: v = begin selection, Enter = copy + status feedback
bind-key -T copy-mode v send-keys -X begin-selection
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode C-w send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode M-w send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode C-k send-keys -X copy-pipe-end-of-line-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"

# Vi copy-mode (if switched via: setw -g mode-keys vi)
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode-vi C-j send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode-vi D send-keys -X copy-pipe-end-of-line-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode-vi DoubleClick1Pane select-pane \; send-keys -X select-word \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"
bind-key -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; run-shell -d 0.3 \; send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'"

# Root: double/triple-click copy without prefix+[ first
bind-key -T root DoubleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'" }
bind-key -T root TripleClick1Pane select-pane -t = \; if-shell -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -H ; send-keys -X select-line ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "'/Users/ultra/.local/bin/tmux-copy-clipboard.sh'" }
# ── session quick-switcher (personal; fzf popup, Ghostty migration) ────────
# prefix+S: fzf-pick a running session (or a project dir under ~/xp, ~/work)
# in a floating popup and switch to it — the "command palette" for tmux
# sessions. Runs inside the popup, never types into whatever pane had focus.
bind-key S display-popup -E -w 70% -h 60% "~/.local/bin/tm"
source-file '/Users/ultra/.config/rig/tmux/rig.tmux.conf'
