# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-strategy-vim 'session' 
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'ssh psql mysql sqlite3 "~rails server" "~rails console" "~yarn start" "~rails s" "~rails c"'
run-shell ~/.tmux/plugins/tmux-resurrect/resurrect.tmux

set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'iterm'
run-shell ~/.tmux/plugins/tmux-continuum/continuum.tmux


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

setw -g aggressive-resize off

# moshi-best-practices: mobile/remote friendly defaults
set -g mouse on
set -g history-limit 100000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#I: #W"

# moshi iOS client detection — propagate MOSHI_CLIENT into new sessions,
# and clear status-line regions while connected so the app's swipe-to-change
# -window gesture (which reads the status bar) keeps working.
set-option -ga update-environment " MOSHI_CLIENT"
if-shell '[ -n "$MOSHI_CLIENT" ]' {
  set -g status-left ''
  set -g status-right ''
}
