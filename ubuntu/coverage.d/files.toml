[[coverage]]
match = ["file:~/.local/bin/agent-browser", "file:~/.local/bin/codex", "file:~/.local/bin/opencode"]
class = "excluded"
reason = "link created by `npm install -g` (prefix ~/.local); the package is declared in packages.toml `npm` (agent-browser, @openai/codex, opencode-ai)"

[[coverage]]
match = ["file:~/.local/bin/corepack", "file:~/.local/bin/pnpm", "file:~/.local/bin/pnpx", "file:~/.local/bin/yarn", "file:~/.local/bin/yarnpkg"]
class = "excluded"
reason = "corepack shims that ship with the node copy under ~/.local/opt/node (declared by ticket #59); `corepack enable` recreates them"

[[coverage]]
match = [
  "file:~/.config/gtk-4.0",
  "file:~/.config/matplotlib",
  "file:~/.config/nautilus",
  "file:~/.config/procps",
  "file:~/.config/task",
  "file:~/.config/tasks-app-linear-sync",
  "file:~/.config/thefuck",
  "file:~/.config/update-notifier",
  "file:~/.config/vale",
  "file:~/.config/vercel-plugin",
  "file:~/.local/share/backgrounds",
  "file:~/.local/share/ibus-table",
  "file:~/.local/share/nano",
  "file:~/.local/share/sounds",
]
class = "excluded"
reason = "empty directory an application created at its first start: nothing in it to track"

[[coverage]]
match = ["file:~/.config/.gsd-keyboard.settings-ported", "file:~/.config/enchant", "file:~/.config/blender", "file:~/.local/share/systemd"]
class = "excluded"
reason = "app markers and caches: the gnome-settings-daemon keyboard-ported marker, empty enchant dictionaries, the Blender extensions cache, systemd's persistent-timer stamp files"

# firefox-passkey-qr (engine module)
[[coverage]]
match = ["file:~/.config/passkey-qr"]
class = "excluded"
reason = "the ha-repair marker the firefox-passkey-qr installer writes: state, not configuration"

[[coverage]]
match = ["file:~/.config/shell"]
class = "untracked"
ticket = "alex-mextner/.files#81"
reason = "bash-env.sh ($BASH_ENV PATH guarantee for non-interactive bash), written by hand; adoption waits for the PATH fixes in #81"
