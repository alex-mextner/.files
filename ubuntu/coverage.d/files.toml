match = [
  "file:~/.local/bin/aiw-ru",
  "file:~/.local/bin/esp_rfc2217_server",
  "file:~/.local/bin/esp_rfc2217_server.py",
  "file:~/.local/bin/espefuse",
  "file:~/.local/bin/espefuse.py",
  "file:~/.local/bin/esphome",
  "file:~/.local/bin/espsecure",
  "file:~/.local/bin/espsecure.py",
  "file:~/.local/bin/esptool",
  "file:~/.local/bin/esptool.py",
  "file:~/.local/bin/git-filter-repo",
  "file:~/.local/bin/glances",
  "file:~/.local/bin/netprint",
