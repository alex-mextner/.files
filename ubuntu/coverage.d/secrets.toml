# Credentials the `files` adapter found. A reason says what the entry holds (key names only, never values) and how it
# comes back on a fresh machine: a login command, a keychain item, a passwords-app entry, or re-issue. Nothing here is
# ever copied into the profile. Entries that mix a portable file with credentials (tasks-backup, ralphex) are tracked
# through the portable file in files/ instead, and the credential files inside stay local.
# Triage of https://github.com/alex-mextner/.files/issues/44.

[[coverage]]
match = ["file:~/.ssh"]
class = "secret"
reason = "SSH private keys (id_ed25519, id_ed25519_home, fuchsia_ed25519), authorized_keys, known_hosts and a host-alias config with Google accounts; restore: re-issue with ssh-keygen -t ed25519 and enrol each new public key (GitHub, git.hyperide.ai, odroid, the crypt-mvp OS Login), the old keys cannot be copied from the profile; ~/.ssh/config stays local until ticket #61 (its ProxyCommand lines hold account e-mails)"

[[coverage]]
match = ["file:~/.gnupg"]
class = "secret"
reason = "GnuPG public keyring and trustdb only (no private-keys-v1.d on this PC, nothing signs with GPG here); restore: gpg --import of the public keys you need, there is no secret key to bring back"

[[coverage]]
match = ["file:~/.config/gh"]
class = "secret"
reason = "GitHub CLI login (hosts.yml holds the token); restore: keychain set <[git] token_ref> then apply (module git-gh logs gh in from the keychain item), or gh auth login"

[[coverage]]
match = ["file:~/.config/forgejo-cli"]
class = "secret"
reason = "Forgejo CLI login for git.hyperide.ai (OAuth tokens; client_ids inside is rig-managed); restore: fj auth login (browser), or ~/.local/bin/fj-login"

[[coverage]]
match = ["file:~/.local/share/forgejo-cli"]
class = "secret"
reason = "Forgejo CLI token store (keys.json: hosts, aliases, tokens written by fj auth login); restore: fj auth login, or ~/.local/bin/fj-login"

[[coverage]]
match = ["file:~/.config/gcloud"]
class = "secret"
reason = "Google Cloud SDK credentials (OAuth refresh tokens and application-default credentials for the two Google accounts that the crypt-mvp ProxyCommands in ~/.ssh/config name); restore: gcloud auth login --no-launch-browser per account, then gcloud auth application-default login"

[[coverage]]
match = ["file:~/.config/cloudflare"]
class = "secret"
reason = "Cloudflare/wrangler login (OAuth and refresh tokens in config/*.json); restore: wrangler login, or use the scoped DNS token in the keychain item agent/cloudflare-mextner-dns through ~/.local/bin/cf-mextner (keychain exec)"

[[coverage]]
match = ["file:~/.config/rclone"]
class = "secret"
reason = "rclone remote gdrive (Google Drive OAuth token in rclone.conf); restore: rclone config reconnect gdrive:"

[[coverage]]
match = ["file:~/.runpod"]
class = "secret"
reason = "Runpod API key (config.toml apikey) and the runpodctl SSH key pair (ssh/runpodctl-ssh-key); restore: runpodctl config --apiKey <key from the Runpod console, Settings > API Keys>; the SSH key is re-created by the next runpodctl ssh use"

[[coverage]]
match = ["file:~/.config/vastai"]
class = "secret"
reason = "Vast.ai API key (vast_api_key); restore: vastai set api-key <key from cloud.vast.ai/account>"

[[coverage]]
match = ["file:~/.config/op"]
class = "secret"
reason = "1Password CLI account and session config (empty at the time of triage); restore: op account add, then op signin with the Secret Key from the emergency kit"

[[coverage]]
match = ["file:~/.config/sops"]
class = "secret"
reason = "sops age identities directory (age/keys.txt holds the private age key; empty at the time of triage); restore: age-keygen -o ~/.config/sops/age/keys.txt and re-encrypt, or copy the key back from the passwords app"

[[coverage]]
match = ["file:~/.config/goa-1.0"]
class = "secret"
reason = "GNOME Online Accounts (account list; tokens live in the login keyring); restore: Settings > Online Accounts, add each account again"

[[coverage]]
match = ["file:~/.local/share/keyrings"]
class = "secret"
reason = "GNOME login keyring (Secret Service: the gh token, keychain-cli items such as agent/cloudflare-mextner-dns, app logins); never copied; restore: created at the first login with the login password, items are re-stored by keychain set and by each app's own login"

[[coverage]]
match = ["file:~/.local/share/pki"]
class = "secret"
reason = "NSS certificate database shared by Chrome and Firefox (imported client certificates and keys); restore: re-import the client certificates you use (Settings of the browser)"

[[coverage]]
match = ["file:~/.mozilla"]
class = "secret"
reason = "Firefox profile (cookies, saved sessions, extensions); restore: apply runs the firefox modules, sign in to iCloud with passwords-app signin and the passwords autofill logs the sites in again"

[[coverage]]
match = ["file:~/.config/google-chrome"]
class = "secret"
reason = "Chrome profile (cookies, saved logins, sync); restore: sign in to Chrome again"

[[coverage]]
match = ["file:~/.config/google-chrome-for-testing"]
class = "secret"
reason = "Chrome for Testing profile of the agents' browser automation (cookies of logged-in test accounts); restore: sign in again when a test needs it"

[[coverage]]
match = ["file:~/.config/google-chrome-headless"]
class = "secret"
reason = "headless Chrome profile of the agents' browser automation (empty at the time of triage; cookies if any); restore: sign in again when a task needs it"

[[coverage]]
match = ["file:~/.env"]
class = "secret"
reason = "home automation and device credentials as environment variables (HA_TOKEN, HA_USERNAME, HA_PASSWORD, FISH_AUDIO_TOKEN, ROUTER_* and UBEE_* host, user and password); restore: create a long-lived token in Home Assistant (profile page), a key in the Fish Audio dashboard, and copy the router admin passwords from the router admin pages"

[[coverage]]
match = ["file:~/.config/crypt-oauth-web-client.env"]
class = "secret"
reason = "Google OAuth client id and secret plus a session secret of the crypt guide's Drive add-on (GC_ARCHIVE_DRIVE_ADDON_*); restore: create a new OAuth client in the GCP project hyperide-crypt (Console > APIs & Services > Credentials), generate a session secret with openssl rand -hex 32, write all three here"

[[coverage]]
match = ["file:~/.config/argocd"]
class = "secret"
reason = "Argo CD login (contexts and user auth-token entries); restore: argocd login <server> --grpc-web for each context in the argocd config"

[[coverage]]
match = ["file:~/.config/linear"]
class = "secret"
reason = "Linear API keys for the profiles default and glide-vc (credentials.toml); restore: create personal API keys in Linear (Settings > API) and write them with the linear CLI login"

[[coverage]]
match = ["file:~/.config/neon"]
class = "secret"
reason = "Neon CLI login (access and refresh tokens in credentials.json) and an anonymous id; restore: neon auth"

[[coverage]]
match = ["file:~/.config/router-cli"]
class = "secret"
reason = "router CLI credentials (credentials.json: routers, default; admin passwords); restore: router login for each router (it stores the password in the keyring)"

[[coverage]]
match = ["file:~/.config/kettle-xiaomi"]
class = "secret"
reason = "Xiaomi kettle BLE beacon key, device id and Xiaomi account credentials (account.env, credentials, kettle.env); restore: re-extract the beacon key and device id with the kettle-xiaomi tool (its README, Xiaomi account login) and write the three files"

[[coverage]]
match = ["file:~/.config/3d-cli"]
class = "secret"
reason = "printer API tokens (printops.yaml token, watch/*.env), printer LAN addresses and a web UI bind address; remote.yaml (ssh heavy host) and subscriptions.yaml are plain config but live in the same entry; restore: `3d init --env` (the 3d-cli profile module runs its non-interactive form on apply and prints the command that sets Spoolman up), or re-issue the PrintOps token on the 3d-api host (3d printops token ..., revoke the old workstation-ultra-cli one with 3d printops token revoke), and recreate watch/*.env with 3d printer setup"

[[coverage]]
match = ["file:~/.config/ha-host-actions"]
class = "secret"
reason = "shared token (token) and the PC login password for the desktop-unlock action (desktop-password) of ~/.local/bin/ha-host-actions.py; restore: write a fresh random token (openssl rand -hex 32, mode 600) and put it into the Home Assistant integration that sends X-HA-Host-Token, type the desktop password again"

[[coverage]]
match = ["file:~/.config/ha-physical-desktop"]
class = "secret"
reason = "bridge.env, credentials.json, TLS certificate and key of the Home Assistant physical-desktop bridge (code is ticket #58); restore: regenerate the certificate with openssl req -x509 and re-issue the credentials in Home Assistant when the bridge is declared"

[[coverage]]
match = ["file:~/.config/tinyprint-bridge"]
class = "secret"
reason = "bridge.env (printer and adapter MAC, bind address) and token (bridge API token) of the tinyprint bridge (code is ticket #58); restore: write a new token file (openssl rand -hex 32, mode 600) and the printer MACs when the bridge is declared"

[[coverage]]
match = ["file:~/.config/u1-share"]
class = "secret"
reason = "Snapmaker U1 camera share credentials (credentials.json, token, config.json token_file, user.json with the Home Assistant user id); restore: create a new Home Assistant long-lived token and re-run the u1-share provisioning (provision_ha.py in ~/.local/share/u1-share)"

[[coverage]]
match = ["file:~/.config/open-remote-commander"]
class = "secret"
reason = "open-remote-commander agent/server env files (ORC_HMAC_SECRET, ORC_PAIRING_SECRET), database_url and device.json token; restore: regenerate the HMAC and pairing secrets (openssl rand -hex 32), re-pair the device, and create a new database credential on the database host"

[[coverage]]
match = ["file:~/.config/guardian-connect"]
class = "secret"
reason = "guardian tunnel credentials: tunnel-key.cred (systemd-creds encrypted to this host, the OpenAI tunnel runtime API key), profiles/pm-guardian.yaml api_key and the profile manifest; restore: run guardian-connect (interactive; asks for the tunnel id and the restricted runtime API key, which you create in the OpenAI platform), then touch ~/.config/guardian-connect/.credential-ok"

[[coverage]]
match = ["file:~/.config/draw-cli"]
class = "secret"
reason = "draw-cli .env (HF_TOKEN) and its ChatGPT browser profile (chatgpt-browser/ holds the ChatGPT login cookies); restore: create a Hugging Face token (hf.co/settings/tokens) and write HF_TOKEN to .env, sign in to ChatGPT again in the draw-cli browser"

[[coverage]]
match = ["file:~/.config/tickets-app"]
class = "secret"
reason = "tasks app API token (config.json: url and a tkt_ token); restore: create a new token in the tasks app (tasks-ultrabricks) and write {url, token} here"

[[coverage]]
match = ["file:~/.desktop-commander-device"]
class = "secret"
reason = "Desktop Commander remote device identity (device.json JWT and device keys, logs); restore: pair the device again through Desktop Commander's remote setup"

[[coverage]]
match = ["file:~/.local/share/com.vercel.cli"]
class = "secret"
reason = "Vercel CLI login (auth.json: token, refreshToken) and telemetry ids; restore: vercel login"

[[coverage]]
match = ["file:~/.local/share/opencode"]
class = "secret"
reason = "OpenCode credentials and data (auth.json provider keys, opencode.db sessions, logs); restore: opencode auth login for each provider"

[[coverage]]
match = ["file:~/.local/share/passwords-app-dev"]
class = "secret"
reason = "private key of the passwords-app development browser extension (chrome-extension-key.pem); restore: regenerate with the passwords-app development script and update the extension id it pins"

[[coverage]]
match = ["file:~/.local/share/hsw-editor"]
class = "secret"
reason = "hsw-editor ChatGPT browser profile (chatgpt-profile/ holds the ChatGPT login) next to generated project data (bank, walls, draw: rebuilt from the hsw-editor repository); restore: sign in to ChatGPT again in the hsw-editor browser profile"

# dc-mcp module (ChatGPT to a local MCP server through an OAuth proxy and a Cloudflare tunnel), issue #143.
[[coverage]]
match = ["file:~/.config/dc-mcp-auth.env"]
class = "secret"
reason = "the login password of the dc-mcp OAuth proxy (PASSWORD=...); restore: generated again by `ubuntu-tweak apply --commit` (module dc-mcp) when the file is absent, mode 600, never printed; then log in to the ChatGPT connector with the new password (read it from this file)"

[[coverage]]
match = ["file:~/.config/dc-mcp-password"]
class = "secret"
reason = "a hand-made plain copy of the dc-mcp proxy password kept for the owner on ubuntu-pc; not used by any unit and not recreated: the password lives in ~/.config/dc-mcp-auth.env"

[[coverage]]
match = ["file:~/.cloudflared"]
class = "secret"
reason = "Cloudflare tunnel login (cert.pem) and tunnel credentials (<tunnel id>.json); restore: `finish-setup --step dc-mcp-cloudflare` (cloudflared tunnel login, tunnel create or reuse, DNS route), or copy both files from the machine that owns the tunnel"

[[coverage]]
match = ["file:~/.local/share/mcp-auth-proxy"]
class = "secret"
reason = "state of the dc-mcp OAuth proxy: signing key (private_key.pem), session secret and the database of issued OAuth clients and tokens; restore: nothing to copy, the proxy creates them on first start and ChatGPT signs in again"

[[coverage]]
match = ["file:~/.config/chatgpt-app"]
class = "secret"
reason = "Chrome profile of the ChatGPT launcher window (chatgpt-window): cookies of the ChatGPT login; restore: sign in to ChatGPT once in that window"
