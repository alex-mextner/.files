# Coverage rules for systemd USER units (`ubuntu-tweak coverage`, adapter `units`). The user's own services are tracked by
# files/ (their unit files are adopted) and units.toml; what is below is what another tool writes or what is not
# configuration. Units of the PROFILE's modules are claimed in those modules' own module.toml (chatgpt-guardian, tg-cli,
# sendspin-player, tmux-boot).

# Engine modules: each writes and enables its own units; the engine modules carry no coverage rule of their own yet.
[[coverage]]
match = ["unit:autoheal.service", "unit:autoheal.timer"]
class = "tracked"
reason = "written and enabled by the engine module autoheal"

[[coverage]]
match = ["unit:passwords-appd.service"]
class = "tracked"
reason = "written and enabled by the engine module passwords-app (its PC drop-in 90-pc.conf is in machines/ubuntu-pc/files)"

[[coverage]]
match = [
  "unit:passkey-qr-health.service", "unit:passkey-qr-health.timer", "unit:passkey-qr-prefs.service", "unit:passkey-qr-prefs.path", "unit:passkey-qr-watch.service",
  "unit:ha-ble-vhci.service",
  "unit:xyz.iinuwa.credentialsd.Credentials.service", "unit:xyz.iinuwa.credentialsd.UiControl.service",
]
class = "tracked"
reason = "written by `passkey-qr install` (engine module firefox-passkey-qr, enabled in machines/ubuntu-pc): the self-heal timer, prefs watcher and request watcher, the HA Bluetooth bridge, and the self-heal drop-ins of the credentialsd services"

# rig (profile.toml [modules.rig], `rig apply commit` from rig/config.yaml) writes these.
[[coverage]]
match = ["unit:ai.hyperide.sysmon.service"]
class = "tracked"
reason = "rig-managed (rig/config.yaml `sysmon:`, header of the unit file); the PC's python path override is machines/ubuntu-pc/files/.config/systemd/user/ai.hyperide.sysmon.service.d/90-pc.conf"

[[coverage]]
match = ["unit:ai.hyperide.model-freshness.service", "unit:ai.hyperide.model-freshness.timer"]
class = "tracked"
reason = "written by rig for the agent-tools model-freshness check (`rig apply commit`; rig leaves *.rig-bak-* copies when it rewrites them)"

# Not configuration.
[[coverage]]
match = ["unit:hsw-heartbeat-20261021.service", "unit:hsw-heartbeat-20261021.timer"]
class = "excluded"
reason = "a one-off finite timer whose last OnCalendar was 2026-10-22 06:00 UTC; it is disabled and can never fire again (the recurring one is hsw-heartbeat.timer)"

[[coverage]]
match = ["unit:remotemouse.service"]
class = "excluded"
reason = "disabled on both machines and the RemoteMouse app (~/.local/share/RemoteMouse) was never part of the profile; install the app first, then adopt the unit"

# The whole AISIS voice stack (adapter/STT/PM/embed/kit/lan-proxy/ha-cli/clipfeed/dashboard/failover/
# whisper-prompt and wyoming-whisper + drop-ins) is versioned in alex-mextner/aisis
# (services/yandex-station/systemd); its unit files are installed from there, not from this profile.
[[coverage]]
match = [
  "unit:aisis-station-adapter.service", "unit:aisis-station-stt.service", "unit:aisis-station-pm.service",
  "unit:aisis-station-embed.service", "unit:aisis-station-kit.service", "unit:aisis-station-lan-proxy.service",
  "unit:aisis-ha-cli.service", "unit:aisis-clipfeed.service", "unit:aisis-dashboard.service",
  "unit:aisis-failover.service", "unit:aisis-whisper-prompt.service", "unit:aisis-whisper-prompt.timer",
  "unit:wyoming-whisper.service",
]
class = "tracked"
reason = "unit files ship from the aisis repo (services/yandex-station/systemd) and are copied into ~/.config/systemd/user by its README runbook; the old aisis-yandex-* names and the .files copies were removed with that move"
