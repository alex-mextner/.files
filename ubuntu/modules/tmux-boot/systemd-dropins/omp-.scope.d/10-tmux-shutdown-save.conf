# Managed by ubuntu-tweaks (profile module tmux-boot). Applies to every omp-<pid>-<ts>.scope created by ~/.local/bin/omp
# (one per omp session, in omp.slice): the omp process is NOT in its tmux pane's tmux-spawn scope, so the pane scope
# drop-in alone would leave the omp processes to stop in parallel with the save, and rig's omp save-panes could not
# find them to record their resume ids. See tmux-spawn-.scope.d/10-tmux-shutdown-save.conf for the mechanism.
[Unit]
Before=tmux-shutdown-save.service
