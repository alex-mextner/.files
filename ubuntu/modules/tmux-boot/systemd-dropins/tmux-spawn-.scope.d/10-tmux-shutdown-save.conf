# Managed by ubuntu-tweaks (profile module tmux-boot). Applies to every tmux-spawn-<uuid>.scope, the transient unit tmux
# 3.x puts each pane in (systemd matches the "tmux-spawn-" prefix of the unit name to this directory).
#
# When the user manager stops, systemd stops all units in ONE transaction, in the reverse of their start order, and
# units without an ordering between them in parallel. tmux-shutdown-save.service cannot name the pane scopes (they
# do not exist yet when its unit is written), so without this line the panes die in parallel with its ExecStop and the
# save finds no shells. Before= here makes the save unit start after every pane scope, so it stops BEFORE them.
# Proven on this host with a throwaway target/scope/service trio (tests/shutdown_proof.md): without it the ExecStop
# saw its panes inactive, with it active.
[Unit]
Before=tmux-shutdown-save.service
