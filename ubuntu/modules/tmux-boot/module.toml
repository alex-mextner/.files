description = "tmux sessions return after a reboot: a user unit starts the tmux server at boot so continuum restores the last snapshot (Linux counterpart of rig's launchd boot agent), and a user timer fires continuum's autosave so the snapshot is current (Linux counterpart of rig's launchd autosave agent)"
enabled = true
order = 92   # after ctmux (90, which brings tmux and the clone); before autoheal (95)
manual = "`sudo loginctl enable-linger $USER` once if linger is off (the unit then starts at login instead of at boot); tmux itself comes from packages.toml"

# Why this module exists (audit row A19): rig's tmux block already wires tmux-resurrect + tmux-continuum
# (save every 15 minutes, `@continuum-restore on`, the omp/cc/codex resume hooks), but rig's own "boot" agent is a
# macOS launchd plist: on Linux nothing starts a tmux server at boot, so the sessions only came back whenever a
# terminal happened to start tmux first, and nothing relaunched the harness panes while the PC sat at the login
# screen. rig-cli's `tmux.boot.enabled` cannot be switched on here: `rig status` would then expect a launchd plist
# that can never exist and the dotfiles-link module would report drift forever. Until rig grows a systemd boot
# (https://git.hyperide.ai/ultrabricks/rig-cli/issues/755) this module is the Linux boot path.
#
# The autosave timer exists for the same reason, one level down (incident 2026-11-08, no snapshot for 16 days): rig forces
# `tmux.autosave` off off-macOS, so the only autosave is continuum's own, whose trigger is a token in the global
# `status-right`. The Moshi iOS client attaches with `tmux set -g status-right ''`, which removes the token for every
# client until the server restarts, and a server without an attached client never evaluates it. tmux-autosave runs
# continuum's save entry point from tmux-autosave.timer instead, so the trigger no longer depends on status-right.
#
# User level: writes $HOME and talks to the user's systemd, so it never runs as root. No options.
[source]
kind = "system"
root = false
install = "install.sh"
check = "install.sh --check"
preview = "install.sh --plan"

# Failover (decided inside install.sh, not by an engine [[fallback]], which would also fire on an unrelated failure):
# with no user systemd bus (ssh without a bus, a container) install writes an XDG autostart entry, and the server then
# starts at graphical login instead of at boot. Once the bus is there the unit is the only start path.

[[coverage]]
match = [
  "unit:tmux-autosave.service", "unit:tmux-autosave.timer", "unit:tmux-boot.service",
  "unit:tmux-watchdog.service", "unit:tmux-watchdog.timer",
  "file:~/.local/bin/tmux-alert", "file:~/.local/bin/tmux-autosave", "file:~/.local/bin/tmux-boot",
  "file:~/.local/bin/tmux-lib", "file:~/.local/bin/tmux-recover", "file:~/.local/bin/tmux-resurrect-save",
  "file:~/.local/bin/tmux-save-debounce", "file:~/.local/bin/tmux-save-now", "file:~/.local/bin/tmux-watchdog",
]
class = "tracked"
reason = "written by the tmux-boot module: install.sh installs exactly these named scripts and units (tests/test_install.py keeps this list equal to what the module ships), so a leftover copy of an asset the module dropped, or an unrelated tmux-* file, shows up as untracked instead of being claimed by a glob"

[[coverage]]
match = ["file:~/.config/autostart/tmux-boot.desktop"]
class = "tracked"
reason = "the tmux-boot module's failover entry when there is no user systemd bus"
