description = "dc-mcp: ChatGPT to this PC's Desktop Commander through `computer chatgpt` (OAuth proxy, shim and Cloudflare named tunnel as three user units); a thin installer over the pinned computer CLI"
enabled = false   # opt in per machine: [modules.dc-mcp] enabled = true + hostname in machines/<host>/machine.toml
order = 160       # after the profile modules that provide node and uv; it needs python3, uv and node
manual = "ChatGPT: Settings, Connectors, add a custom MCP server; `computer chatgpt connect` prints the fields (Server URL https://<hostname>/mcp, Authentication OAuth) and the password's place (~/.config/dc-mcp-auth.env, line PASSWORD=...). The Cloudflare login, tunnel and DNS route are the finish step `finish-setup --step dc-mcp-cloudflare`"

# The stack itself is the computer CLI's (https://github.com/alex-mextner/computer-use-plugin, `computer chatgpt`, see its
# CUTOVER.md): pinned checksum-verified mcp-auth-proxy and cloudflared, the pinned Desktop Commander run as `computer mcp serve`,
# the shim (`computer chatgpt shim`), the rotated access log (`computer chatgpt logs`), the journal filter (`computer chatgpt
# quiet`) and the unit text, all written by `computer chatgpt init`. install.sh installs the CLI with `uv tool install` at the commit
# it pins (CLI_REV) and reinstalls it when the uv receipt names another source; the packages phase cannot hold that pin, it compares
# tool names only. Upgrading the stack is a change of CLI_REV.
#
#   install.sh   the pinned CLI, the module's keys in ~/.config/computer/chatgpt/config.toml, then `computer mcp install` and
#                `computer chatgpt init` (it starts nothing); on a machine of the first version of this module it also copies the
#                Cloudflare login and tunnel credentials from ~/.cloudflared into the CLI's directory. The layout keeps the paths
#                of the first version so the OAuth state, password and access log carry over (details in its header). When
#                `init` changed the unit text, apply RESTARTS the dc-mcp units that are running (bridge, shim, then tunnel) so
#                they run the new text; stopped units stay stopped. An unchanged machine is never restarted.
#   finish.sh    the human step: `computer chatgpt login` (Cloudflare), `computer chatgpt start`.
#
# The bridge, shim and tunnel are listed in the machine's units.toml, not the shared one: only a machine that holds the Cloudflare
# credentials can run the tunnel unit. dc-mcp-tool-log-prune.timer (shared units.toml, files/) keeps Desktop Commander's rotated
# tool-call logs in check until a pruner lands in agent-tools.
[source]
kind = "system"
root = false
install = "install.sh"
check = "install.sh --check"
preview = "install.sh --plan"

[[finish]]
id = "dc-mcp-cloudflare"
title = "Connect ChatGPT to this computer (dc-mcp: Cloudflare tunnel)"
title_ru = "Подключить ChatGPT к этому компьютеру (dc-mcp: туннель Cloudflare)"
why = "the connector needs a Cloudflare login and tunnel credentials for this machine; they authorize a DNS name in your Cloudflare account, so only you can grant them, and they never enter the repository"
why_ru = "для коннектора нужны вход в Cloudflare и ключи туннеля этой машины; они дают право на DNS-имя в твоём аккаунте Cloudflare, поэтому выдать их можешь только ты, и в репозиторий они не попадают"
action = "`computer chatgpt login` opens a browser: authorize the zone of the hostname; it creates (or reuses) the tunnel and points the hostname at it; then the three units are started and the ChatGPT connector fields and the place of the password are printed"
action_ru = "`computer chatgpt login` откроет браузер: разреши зону своего имени; он создаст (или возьмёт готовый) туннель и направит на него имя; затем запускаются три юнита и печатаются поля коннектора ChatGPT и место пароля"
check = ["./finish.sh", "check"]
run = ["./finish.sh", "run"]
requires = ["apply"]

[[coverage]]
match = ["file:~/.config/computer/chatgpt/config.toml"]
class = "tracked"
reason = "the module's keys are written from [modules.dc-mcp] by install.sh; the rest is `computer chatgpt init`'s"

[[coverage]]
match = ["unit:dc-mcp-bridge.service", "unit:dc-mcp-shim.service", "unit:dc-mcp-tunnel.service"]
class = "tracked"
reason = "unit files written by `computer chatgpt init` (run by the dc-mcp module); enabled through the machine's units.toml"

[[coverage]]
match = ["unit:dc-mcp-tool-log-prune.service", "unit:dc-mcp-tool-log-prune.timer"]
class = "tracked"
reason = "unit files are tracked in files/.config/systemd/user; the timer is listed in the shared units.toml"

[[coverage]]
match = ["file:~/.local/share/computer"]
class = "excluded"
reason = "generated: the computer CLI's pinned binaries and Desktop Commander tree; reinstalled by `computer mcp install` and `computer chatgpt init`"

[[coverage]]
match = ["file:~/.local/state/dc-mcp"]
class = "excluded"
reason = "generated: the rotated access log and client table of the computer chatgpt shim; rebuilt by itself, never configuration"
