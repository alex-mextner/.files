description = "dc-mcp: Desktop Commander MCP server for ChatGPT behind an OAuth 2.1 proxy (mcp-auth-proxy) and a Cloudflare named tunnel, as three user units (proxy, shim, tunnel); pinned checksum-verified binaries, locally generated password, rootless"
enabled = false   # opt in per machine: [modules.dc-mcp] enabled = true + hostname in machines/<host>/machine.toml
order = 160       # after the profile modules that provide node / Chrome; it needs only python3, curl and node
manual = "ChatGPT: Settings, Connectors, add a custom MCP server; Server URL https://<hostname>/mcp (your [modules.dc-mcp] hostname), Authentication OAuth, log in with the password in ~/.config/dc-mcp-auth.env (line PASSWORD=...). The Cloudflare login, tunnel and DNS route are the finish step `finish-setup --step dc-mcp-cloudflare`; the proxy password is generated by apply and never printed"

# What this module reproduces (it is the ubuntu-pc stack, built by hand on 8 Nov 2026):
#   ChatGPT -> https://<hostname>/mcp -> Cloudflare named tunnel (cloudflared, dc-mcp-tunnel.service)
#           -> shim on 127.0.0.1:<shim_port> (dc-mcp-shim.service, files/.local/share/dc-mcp-shim/shim.mjs: adds the
#              WWW-Authenticate challenge and the protected-resource path rewrite ChatGPT's OAuth setup needs; without it
#              ChatGPT says the server "does not provide a browser setup URL")
#           -> mcp-auth-proxy on 127.0.0.1:<port> (OAuth 2.1 + password login, dc-mcp-bridge.service)
#           -> `npx -y <package>` over stdio = Desktop Commander (https://github.com/wonderwhy-er/DesktopCommanderMCP)
# Not the same as the "guardian tunnel" of the README Manual steps (guardian-tunnel.service: OpenAI's own tunnel-client, needs a
# platform API key, serves `pm chatgpt mcp`). The two share nothing: other units, other ports, other credentials.
#
# User level, no root: it writes $HOME and never talks to the system. Parts and who owns them:
#   install.sh           ~/.local/bin/mcp-auth-proxy and ~/.local/bin/cloudflared from the pinned releases of pins.tsv (sha256
#                        verified, a mismatch is refused and leaves the installed file alone), ~/.config/dc-mcp.env (this
#                        machine's settings, not secret), ~/.config/dc-mcp-auth.env (PASSWORD=..., generated once, mode 600).
#   files/.config/systemd/user/dc-mcp-{bridge,shim,tunnel}.service and files/.local/share/dc-mcp-shim/shim.mjs   tracked leaves
#                        (the engine's files phase links them), written with %h and the two environment files, so no
#                        per-machine value is in the repository.
#   finish.sh            the human step: cloudflared tunnel login, tunnel create, DNS route, then it starts the three units.
#
# Options ([modules.dc-mcp] in machines/<host>/machine.toml), all validated:
#   hostname  REQUIRED, the public name of this machine's connector. ONE HOSTNAME PER MACHINE: two machines that serve the same
#             hostname split the requests between them (and `route dns --overwrite-dns` moves it to whoever ran it last).
#   tunnel    Cloudflare tunnel name, default dc-<short hostname of the machine> (tunnel names are per Cloudflare account)
#   port      loopback port of the proxy, default 8766
#   shim_port loopback port of the shim (the tunnel's target), default 8767; must differ from port
#   log_max_kib, log_keep  size cap (KiB, default 2048) and number of rotated files (default 3) of the shim access log
#   tool_log_keep, tool_log_max_age_days  retention of Desktop Commander's rotated tool-call logs: newest 5 files, none older than 30 days
#   package   the npm package the proxy runs, default @wonderwhy-er/desktop-commander@latest (as on ubuntu-pc: npx fetches it
#             when the unit starts; pin e.g. @wonderwhy-er/desktop-commander@0.2.x to stop following releases)
#
# Logging, all low overhead and rotated without root (details in the headers of the files named):
#   shim access log   ~/.local/state/dc-mcp/access.log, one compact line per request, never queries, bodies, tool arguments or
#                     secrets (shim.mjs); read with `dc-mcp-log`; rotated by the shim at log_max_kib with log_keep files kept
#   journal           the proxy's per-request lines and supergateway's copies of every JSON-RPC message are filtered out of
#                     the journal by dc-mcp-quiet (the bridge's ExecStart); warnings and errors still reach it
#   tool-call log     Desktop Commander never deletes its rotated ~/.claude-server-commander/claude_tool_call_*.log;
#                     dc-mcp-tool-log-prune.timer (daily, listed in the shared units.toml) keeps the newest tool_log_keep files
#                     younger than tool_log_max_age_days and never touches the active file
#
# The bridge, shim and tunnel are NOT in the shared units.toml: the tunnel unit may only be started once the Cloudflare credentials exist, and units.toml makes
# every listed unit "enable --now" and reports it pending until active, so a fresh machine would loop on a unit that cannot run.
# The finish step enables and starts all three (`enable --now`); on a machine that already runs them nothing changes, and
# Restart=always keeps them up (linger is on globally, see units.toml).
#
# Boot and crash behaviour (units are WantedBy=default.target of the user manager; `units.toml` sets linger = true, which
# `loginctl enable-linger` does for the own user without root, so the user manager and these units start at boot, before any
# login): every unit has Restart=always and StartLimitIntervalSec=0, so a crash loop never exhausts the start limit.
#
# Secrets, all local: ~/.config/dc-mcp-auth.env, ~/.cloudflared/{cert.pem,<id>.json}, ~/.local/share/mcp-auth-proxy (the proxy's
# OAuth keys and database). They are listed in coverage.d/secrets.toml with how each comes back. A machine that loses them runs
# the finish step again (new login, tunnel credentials; ChatGPT logs in again with the new password).
[source]
kind = "system"
root = false
install = "install.sh"
check = "install.sh --check"
preview = "install.sh --plan"

[[finish]]
id = "dc-mcp-cloudflare"
title = "Connect ChatGPT to this computer (dc-mcp: Cloudflare tunnel)"
title_ru = "Подключить ChatGPT к этому компьютеру (dc-mcp: туннель Cloudflare)"
why = "the connector needs a Cloudflare login and tunnel credentials for this machine; they authorize a DNS name in your Cloudflare account, so only you can grant them, and they never enter the repository"
why_ru = "для коннектора нужны вход в Cloudflare и ключи туннеля этой машины; они дают право на DNS-имя в твоём аккаунте Cloudflare, поэтому выдать их можешь только ты, и в репозиторий они не попадают"
action = "`cloudflared tunnel login` opens a browser: authorize the zone of the hostname; then the tunnel is created (or reused), the hostname is pointed at it after a y/N question (it moves the name to THIS machine), the three units are started, and the ChatGPT connector settings and the place of the generated password are printed"
action_ru = "`cloudflared tunnel login` откроет браузер: разреши зону своего имени; затем туннель создаётся (или берётся готовый), имя направляется на него после вопроса y/N (имя переезжает на ЭТУ машину), запускаются три юнита и печатаются настройки коннектора ChatGPT и место сгенерированного пароля"
check = ["./finish.sh", "check"]
run = ["./finish.sh", "run"]
requires = ["apply"]

[[coverage]]
match = ["file:~/.local/bin/mcp-auth-proxy", "file:~/.local/bin/cloudflared", "file:~/.config/dc-mcp.env"]
class = "tracked"
reason = "installed from the pinned releases (pins.tsv, sha256 verified) and rendered from [modules.dc-mcp] by the dc-mcp module"

[[coverage]]
match = ["unit:dc-mcp-bridge.service", "unit:dc-mcp-shim.service", "unit:dc-mcp-tunnel.service", "unit:dc-mcp-tool-log-prune.service", "unit:dc-mcp-tool-log-prune.timer"]
class = "tracked"
reason = "unit files are tracked in files/.config/systemd/user; started by the dc-mcp module's finish step (or listed in the machine's units.toml)"

[[coverage]]
match = ["file:~/.local/state/dc-mcp"]
class = "excluded"
reason = "generated: the rotated access log of the dc-mcp shim (size-capped by log_max_kib and log_keep); rebuilt by itself, never configuration"
