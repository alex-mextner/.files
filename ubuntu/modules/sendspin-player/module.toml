description = "This PC's speakers as a Music Assistant player: PortAudio, the sendspin client and its user service (unit shipped in the machine overlay)"
enabled = false   # only machines/ubuntu-pc opts in: the unit file sendspin-ubuntu-pc.service lives in that overlay, another machine needs its own
order = 140       # after rig (100) and the other profile modules
# the engine has no `requires` key yet (restore requires = ["base-tools", "brew"] when it does): order 140 only runs this
# module after base-tools (apt) and brew (uv); it does not skip it when one of them failed

[source]
kind = "builtin"

# sendspin imports PortAudio through sounddevice: without libportaudio2 `sendspin audio-devices list` fails.
[install]
apt = ["libportaudio2"]

[[post]]
name = "sendspin-tool"
description = "uv tool install sendspin (the Sendspin client; ~/.local/bin/sendspin)"
run = ["/bin/sh", "-c", "PATH=\"/home/linuxbrew/.linuxbrew/bin:$HOME/.local/bin:$PATH\"; UV_TOOL_BIN_DIR=\"$HOME/.local/bin\" uv tool install sendspin"]
check = ["/bin/sh", "-c", "[ -x \"$HOME/.local/bin/sendspin\" ]"]   # the exact path the unit's ExecStart uses

[[post]]
name = "enable"
description = "enable and start sendspin-ubuntu-pc.service (the unit file is in the ubuntu-pc machine overlay, machines/ubuntu-pc/files/.config/systemd/user/)"
after = "sendspin-tool"
run = ["systemctl", "--user", "enable", "--now", "sendspin-ubuntu-pc.service"]
check = ["systemctl", "--user", "is-enabled", "sendspin-ubuntu-pc.service"]

[[coverage]]
match = ["file:~/.local/bin/sendspin"]
class = "tracked"
reason = "link made by the `sendspin-tool` post (uv tool install sendspin)"

[[coverage]]
match = ["unit:sendspin-ubuntu-pc.service"]
class = "tracked"
reason = "the player unit shipped in machines/ubuntu-pc/files and enabled by this module's `enable` post"
