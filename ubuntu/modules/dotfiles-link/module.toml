description = "Applies the dotfiles repository to this home (links, merged shell and git config, zplug, vim-plug, submodules, the rig global config): ~/.files/install-ubuntu.sh"
enabled = true
order = 111              # right after the `dotfiles` module (110) that checks the repository out
manual = "read the `manual:` lines of `~/.files/install-ubuntu.sh --plan`: a private submodule whose repository this machine cannot read needs access to it (the line names the owner account). bun must be installed (`brew install oven-sh/bun/bun`). Then re-run apply"

# User level: the installer writes only into $HOME and ~/.files, never as root. Exit codes follow the
# system-module protocol: install-ubuntu.sh answers 1 for pending work under --check, which is drift (3).
[source]
kind = "system"
root = false
install = "install.sh"
check = "install.sh --check"
preview = "install.sh --plan"

# What install-ubuntu.sh and the plan's rc links create in $HOME (see the header of ~/.files/install-ubuntu.sh).
[[coverage]]
match = [
  "file:~/.zprofile",
  "file:~/.profile",
  "file:~/.vimrc",
  "file:~/.gitattributes",
  "file:~/.hyper.js",
  "file:~/.tmux",
]
class = "tracked"
reason = "linked into ~/.files by this module (install-ubuntu.sh link_into_home) or by the plan's rc links (~/.profile, ~/.zprofile)"

[[coverage]]
match = ["file:~/.gitconfig"]
class = "tracked"
reason = "this module puts the [include] of ~/.files/.gitconfig.shared at its top; the identity and credential helpers come from the git-gh module (git config --global), hooksPath and core.excludesfile from rig; the file holds an e-mail address, so it is never copied into the profile"

[[coverage]]
match = ["file:~/.config/rig"]
class = "tracked"
reason = "config.yaml is merged from ~/.files/rig/config.yaml by install-ubuntu.sh (the repository wins for every key it declares); env/, tmux/, sysmon/ and MEMORY.md are written by `rig apply commit`, which this module runs"
