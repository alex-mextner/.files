# service-failover (restart backoff): applies to EVERY service of this manager through the type-level drop-in directory
# service.d/. A crash loop is retried with growing delays: from the unit's RestartSec, in 8 steps, up to 5 minutes. A
# unit that keeps restarting is found by service-failover-scan (10 or more restarts while in auto-restart) and handed to a
# repair session; a unit that ends up `failed` is found by it, and by OnFailure= (15-failover-repair.conf), the same way.
#
# StartLimitIntervalSec=/StartLimitBurst= are deliberately NOT set here. systemd counts EVERY start against them (timer
# runs, socket activation, manual starts, not only restarts), so a global value throttles every timer-driven one-shot
# that runs more than BURST times per interval, and a type-level drop-in also overrides the limits that units set in
# their own unit files (crash-loop tolerance of the dc-mcp tunnels, `0` of the wyoming units). A unit that exhausts its
# own limit turns `failed`, which is exactly what the scan and OnFailure= look for.
#
# RestartSteps=/RestartMaxDelaySec= need systemd 254 or newer; an older manager warns about the key and ignores it.
# The step counter is systemd's NRestarts: it counts restarts since the unit was last started by hand (or
# reset-failed), not within a time window, so a service that crashes rarely drifts toward the 5 minute delay over time.
# Restart= itself is NOT set here: it would override Restart=always of units that want it, and Restart=always is refused
# for Type=oneshot units (the unit would not load). Units that lack Restart= get it from the module option restart_units.
[Service]
RestartSteps=8
RestartMaxDelaySec=5min
