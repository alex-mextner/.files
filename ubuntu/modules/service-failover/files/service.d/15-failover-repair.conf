# service-failover (escalation): start the repair template for the unit on a failure. %n is the unit name. systemd fires
# OnFailure= on EVERY crash, also while it is still restarting the unit, so the template's script decides whether this is
# the end of the road (state `failed`, or a long auto-restart loop) and leaves everything else to systemd.
# Installed only where an omp launcher exists.
[Unit]
OnFailure=service-failover-repair@%n.service
