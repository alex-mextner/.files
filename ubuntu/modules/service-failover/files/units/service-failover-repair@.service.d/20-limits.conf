# service-failover (repair template): OnFailure= is reset for this template (this file sorts after 15-failover-repair.conf):
# a failing repair must not start a repair of the repair. The rate limit lives in the repair script (one session per unit
# per 12 hours, 4 per day, stamp files in its state directory): systemd's start counter of a template instance is dropped
# as soon as the unloaded instance is garbage collected, so it cannot carry a limit.
[Unit]
OnFailure=
