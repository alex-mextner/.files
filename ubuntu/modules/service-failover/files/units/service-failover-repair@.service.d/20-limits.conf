# service-failover (repair template): OnFailure= is reset for this template (this file sorts after 15-failover-repair.conf):
# a failing repair must not start a repair of the repair. The rate limit lives in the repair script (one session per unit
# per 12 hours, 4 per day, stamp files in its state directory): systemd's start counter of a template instance is dropped
# as soon as the unloaded instance is garbage collected, so it cannot carry a limit.
#
# The instance has NO start limit either (StartLimitIntervalSec=0). A unit that crash-loops fast fires OnFailure= on every
# crash, so its repair instance is started once per crash; with the default limit (5 starts in 10 s) systemd refused the
# start that reports the final `failed` state ("Start request repeated too quickly", 2026-11-10 22:55:09, wireplumber.service)
# and the failure went unreported. The script decides what is worth a session, not systemd's start counter.
[Unit]
StartLimitIntervalSec=0
OnFailure=
