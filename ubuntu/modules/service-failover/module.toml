description = "service-failover: every systemd service retries a crash with a growing restart backoff, a service that still ends up failed or restart-looping gets a detached omp repair session (rate limited), failed services of other hosts are scanned over ssh, and an optional docker autoheal restarts unhealthy containers"
enabled = false   # opt in per machine: [modules.service-failover] enabled = true in machines/<host>/machine.toml
order = 175       # after the aisis module (170): the scan also watches the units that module installs

# User level: the installer writes only ~/.config/systemd/user, ~/.local/bin and ~/.config/service-failover and talks to
# the user's systemd, so it never runs as root, and it restarts nothing (daemon-reload only: a unit takes the new
# backoff at its next start). The root level (/etc/systemd/system/service.d) is a separate, once-per-host manual step:
# `sudo bash install.sh --system [UNIT...]`, see README.md.
# Options ([modules.service-failover]): repair, hosts, restart_units, autoheal (see install.sh).
[source]
kind = "system"
root = false
install = "install.sh"
check = "install.sh --check"
preview = "install.sh --plan"

# notify-send (the repair script tells the user that a service is down); the engine installs it, so --check does not
# have to ask for a manual step on a fresh machine.
[deps]
apt = ["libnotify-bin"]

[[coverage]]
match = [
  "unit:service-failover-repair@.service", "unit:service-failover-scan.service", "unit:service-failover-scan.timer",
  "file:~/.local/bin/service-failover-repair", "file:~/.local/bin/service-failover-scan",
  "file:~/.config/service-failover*", "file:~/.config/systemd/user/service.d*",
  "file:~/.config/systemd/user/service-failover-repair@.service*",
]
class = "tracked"
reason = "written by the service-failover module"
