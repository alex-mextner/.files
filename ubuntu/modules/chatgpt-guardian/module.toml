description = "ChatGPT guardian (agent-tools): venv + chatgpt-guardian CLI, user-level Chrome when asked, two dedicated browsers (home account, glide.vc account), guardian + observer services, enrolled chats; no OpenAI API key"
enabled = false   # a machine opts in: [modules.chatgpt-guardian] enabled = true in machines/<host>/machine.toml
order = 130       # after rig (100) and tg-cli (120)
manual = "log in to ChatGPT once in each guardian browser profile (home account on its debug port, or with home_private_display in a normal Chrome window on its profile while the home units are stopped; glide.vc account on its private display; the profile keeps the login, the output names which one is signed out), then run apply again; the guardian tunnel (ChatGPT -> local MCP) needs an OpenAI platform API key and is NOT part of this module"

# User level: writes $HOME and talks to the user's systemd, so it never runs as root. Options
# ([modules.chatgpt-guardian] in profile.toml / machine.toml): repo, dir, package, chrome, home_port, glide_port,
# xvfb, home_memory_high, home_memory_max, home_private_display, chats_home, chats_glide, glide_email_domain, home_email_domain (see install.sh; the email domains are read by ./relogin and ./profile-sync (through its wrapper) and passed to the glide guardian unit (check --live) and, when home_email_domain is set, to the home guardian unit (check --refuse-other)).
#
# Personal module: the two accounts (workspaces `home` and `glide.vc`), their control ports 8790/8791 and the private
# displays (:111 glide.vc, :112 home when home_private_display is true) are fixed in the units; only the DevTools ports, Chrome, Xvfb and the enrolled chats are options.
# chrome = "user" installs a rootless Chrome from the HTTPS download of dl.google.com (Google publishes no checksum for the
# `current` package) under ~/.local/opt and runs it with --no-sandbox (unprivileged user namespaces are AppArmor-restricted
# and there is no setuid helper without root), through the dedicated wrapper ~/.local/bin/chatgpt-guardian-chrome that only
# the two guardian profiles use. With root, install google-chrome-stable and keep the default instead.
[source]
kind = "system"
root = false
install = "install.sh"
check = "install.sh --check"
preview = "install.sh --plan"

# The glide.vc browser (and the home browser when home_private_display is true) runs on a private X display (Xvfb); mcookie and xauth come with util-linux / xauth.
[deps]
apt = ["xvfb", "xauth"]

# What install.sh creates (facts 2, 3, 4 and the dependency files of the units).
[[coverage]]
match = ["file:~/.local/bin/chatgpt-guardian", "file:~/.local/bin/chatgpt-guardian-chrome", "file:~/.local/bin/chatgpt-guardian-profile-sync", "file:~/.local/bin/pm", "file:~/.local/share/agent-tools"]
class = "tracked"
reason = "the guardian venv with the CLI links (chatgpt-guardian, pm), the Chrome wrapper, the wrapper of the opt-in ./profile-sync (see the comment below), and the two dedicated browser profiles under ~/.local/share/agent-tools/chatgpt-guardian; the ChatGPT login inside each profile is a manual step of this module (see `manual`)"

[[coverage]]
match = ["file:~/.config/agent-tools"]
class = "tracked"
reason = "chatgpt-guardian/<workspace>.json are written by this module (the units' ConditionPathExists); env is written by rig (ship_delegator: AGENT_TOOLS_ROOT); the rest (MEMORY.md, overrides.log, ship-audit.jsonl, agent-browser-reaper.conf, a copy of agent-tools' example) is written by the agent-tools tools themselves"

# The one human step of the glide.vc browser: its Chrome profile lives on the private display, so the owner signs in
# once in a visible window opened on the same profile. `./relogin` (see its header) stops the glide units, opens the
# window, waits until it is closed, starts the units again and verifies them. `check --live` (the glide guardian unit's ExecStartPre) only asks the browser and never uses the marker; `check` asks the running browser which
# account is signed in (the email domain `glide_email_domain`, default glide.vc), and falls back to the marker file
# that `run` writes after a verified relogin. The `home` account is not part of it: its browser is a window on this desktop (or, with home_private_display, on its own display :112 where its profile stays signed in).
[[finish]]
id = "glide-chatgpt-login"
title = "Sign in to ChatGPT with the glide.vc account"
title_ru = "Войти в ChatGPT аккаунтом glide.vc"
why = "the glide.vc guardian browser is signed in to the wrong ChatGPT account; its profile lives on a hidden display, so only you can type the password in a visible window"
why_ru = "браузер стража glide.vc залогинен не в тот аккаунт ChatGPT; его профиль живёт на скрытом дисплее, поэтому пароль можешь ввести только ты, в видимом окне"
action = "A Chrome window opens on the glide.vc profile: sign in to ChatGPT with the glide.vc account, then close the window; the guardian units are restarted and checked by themselves"
action_ru = "Откроется окно Chrome с профилем glide.vc: войди в ChatGPT аккаунтом glide.vc и закрой окно; юниты стража перезапустятся и проверятся сами"
check = ["./relogin", "check"]
run = ["./relogin", "run"]

# OPT-IN sign-in copy: `chatgpt-guardian-profile-sync pull <home|glide>` (this directory's ./profile-sync, a wrapper of it is written
# by install.sh and NEVER run by apply or by a finish step) copies the ChatGPT / OpenAI cookies of the dock Chrome profile
# (~/.config/google-chrome) into a guardian profile, after stopping that profile's guardian units and with a backup and a rollback; `status` is
# read-only. It reuses ./relogin's stop / start / verify / DevTools-probe code by import. The header of ./profile-sync has the workflow, the exit codes and the limits.

# The seven units install.sh renders from units/ and enables, plus the home display when home_private_display is true. guardian-tunnel.service is not here: it is the user's own unit
# (files/.config/systemd/user), the module only gates it off with a drop-in until a platform API key exists.
[[coverage]]
match = [
  "unit:chatgpt-guardian-home.service", "unit:chatgpt-guardian-home-browser.service", "unit:chatgpt-guardian-home-observer.service",
  "unit:chatgpt-guardian-glide.service", "unit:chatgpt-guardian-glide-browser.service", "unit:chatgpt-guardian-glide-observer.service",
  "unit:chatgpt-guardian-glide-display.service", "unit:chatgpt-guardian-home-display.service",
  "unit:chatgpt-guardian-revive.service", "unit:chatgpt-guardian-revive.timer",
]
class = "tracked"
reason = "rendered from units/ and enabled by the chatgpt-guardian module"

# Opt-in (control_pass_dir, audit_timers): the 30-minute control pass and the per-account pm audit, rendered from units/control and units/audit.
[[coverage]]
match = [
  "unit:guardian-proactive-control.service", "unit:guardian-proactive-control.timer",
  "unit:pm-chatgpt-audit-home.service", "unit:pm-chatgpt-audit-home.timer", "unit:pm-chatgpt-audit-glide.service", "unit:pm-chatgpt-audit-glide.timer",
  "unit:pm-chatgpt-login-assist@.service", "unit:pm-chatgpt-login-assist@.timer", "unit:pm-chatgpt-login-assist@home.timer", "unit:pm-chatgpt-login-assist@glide.vc.timer",
]
class = "tracked"
reason = "rendered from units/control and units/audit and enabled by the chatgpt-guardian module (options control_pass_dir, audit_timers and login_assist)"
