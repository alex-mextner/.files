# Shared configuration for the ubuntu-tweak engine; machines/<hostname>/machine.toml wins over it.
[profile]
description = "alex personal Ubuntu settings"

# Capture rules, evaluated by `ubuntu-tweak capture` together with the engine defaults. Uncomment and adjust.
# [capture]
# exclude = ["/org/gnome/shell/app-picker-layout"]            # never captured
# machine = ["/org/gnome/settings-daemon/plugins/power/**"]   # captured into machines/<host>/settings/
# include = ["/org/gnome/desktop/input-sources/mru-sources"]  # lifts the `state` / `auto` skips for these keys
# include_files = [".config/mimeapps.list", ".config/gtk-3.0/bookmarks"]  # file allow-list
# machine_files = [".config/monitors.xml"]                    # adopted into machines/<host>/files/
#
# Where NEW keys go: the first matching entry wins; a key a bundle already holds stays there,
# and with no match a key goes to its panel's own bundle (settings/<panel>.ini).
# [capture.bundles]
# "dev-keyboard" = ["org/gnome/desktop/wm/keybindings/**", "org/gnome/shell/extensions/tiling-assistant/**"]
# "laptop/power" = ["org/gnome/settings-daemon/plugins/power/**"]

# rig (skills, agent hooks for omp/claude/codex, tmux, bun, tools, sysmon): off in the engine, on for every
# machine of this profile. The global rig config comes from ../rig/config.yaml through the dotfiles-link
# module (the single source of truth), so the rig profile repo is not used: `activate = false` keeps rig from
# adding a second one. rig-cli#746 (`rig activate`) is merged; `rig activate` here would only write
# `tools.items.ctmux`, which the ctmux module already provides, and report macOS-only areas (tg_ctl, tcc_watch,
# tgctl_reaper, spotlight) as "cannot activate", so there is nothing to gain from switching it on.
# The dotfiles-link module runs `rig apply commit` after the installer instead.
[modules.rig]
enabled = true
repo = "https://git.hyperide.ai/ultrabricks/rig-cli"
profile_sync = false
activate = false

# Module decisions (audit row D1, AUDIT.md). Most of these are also the engine default; they are written out so
# that a later change of an engine default cannot silently switch off something this user relies on, and so that
# every module has its reason on record. `ubuntu-tweak machine` shows where each value comes from.

# The user's own dotfiles repository is this profile's source: every machine clones it first (request 14).
[modules.dotfiles]
enabled = true
[modules.dotfiles-link]
enabled = true   # links, shell blocks, zplug, vim-plug, submodules and `rig apply commit` of the same repository

# Init pipeline (requests 9 and 20): zsh first, gh + git identity, brew for Linux, curl/zip/7zip, clipboard tools
# (gh and tmux copy through them). Laptop and PC both used all of them.
[modules.base-tools]
enabled = true
[modules.zsh]
enabled = true
[modules.shell-rc]
enabled = true
[modules.git-gh]
enabled = true
[modules.brew]
enabled = true   # the laptop's Linuxbrew held 205 formulae (laptop brew list); here brew provides vale and fzf, and the module's tools step provides uv and bun
[modules.clipboard]
enabled = true

# Passwords and Firefox (request A9): iCloud passwords fill into Firefox, which logs itself in. The polkit and
# policy steps are the root part, the rest runs as the user. Sign-in itself is manual (README, "Manual steps").
[modules.passwords-app]
enabled = true
[modules.passwords-app-polkit]
enabled = true
[modules.firefox]
enabled = true
[modules.firefox-policy]
enabled = true
[modules.firefox-autologin]
enabled = true

# Remote access and safety on every machine (request A7 and the memory-starved laptop's lessons): ssh server for
# the phone/mosh/IDE, memguard against runaway memory. The PC has 60 GB RAM, so memguard's thresholds are the
# PC overlay's business (machines/ubuntu-pc/machine.toml), not a reason to switch it off.
[modules.ssh-server]
enabled = true
[modules.memguard]
enabled = true

# Desktop the user asked for: the macOS-style dock (A8), Space preview in Files, English-in-overview.
[modules.hyperdock]
enabled = true
[modules.quicklook]
enabled = true
[modules.english-in-overview]
enabled = true

# Unattended self-heal (user directive, request 21: "failover, everything must reproduce"): a user timer re-runs
# `ubuntu-tweak apply --commit --no-sudo` at login and daily. It never asks for root and never prompts, so the
# root remainder still waits for an interactive `ubuntu-tweak apply --commit`. Every machine of this profile
# wants it (it was only in the PC overlay before).
[modules.autoheal]
enabled = true

# tmux sessions return after a reboot (A19): see modules/tmux-boot.
[modules.tmux-boot]
enabled = true


# memguard (engine module: swap-drain, the macOS-like "pull swap back into RAM when there is room"). The engine's
# memguard.toml ships the heavy-run gate and the heavy lock OFF for everyone; these three are the values the laptop ran
# with (read from its installed /etc/memguard/memguard.toml, 23 Oct 2026) and they hold for every machine of this
# profile because they name the owner's own tooling, not hardware:
#   heavy_locks  /tmp/3d-cli-heavy.lock is the flock the 3d-cli heavy runs queue on; a drain never starts while it is held
#   heavy_gate   "auto": ask the omp heavy-op memory gate how many test suites / review passes are live, skip the drain
#   heavy_hook   the omp hook file that names that gate script (it exists on the PC: ~/.omp/agent/hooks/)
# The numeric thresholds stay the engine's: they are percentages of RAM (headroom max(8 GB, 20 %), abort below
# max(6 GB, 12 %)), so they already scale to the PC's 62 GB (12.4 GB headroom, 7.4 GB abort): `swap-drain --dry-run`
# on the PC, rendered with these options, says "would drain /swap2.img 21190M" (swap used 21 GB of 32 GB, 41 GB available).
[modules.memguard.swap]
heavy_locks = ["/tmp/3d-cli-heavy.lock"]
heavy_gate = "auto"
heavy_hook = "~/.omp/agent/hooks/heavy-op-memory-gate.pre-bash.json"

# Files adopted into files/ (and machines/<host>/files/): a hand-written, credential-free config the user owns.
# `capture` re-reads these (a file the app rewrote shows as `differs`) and scans them for secrets again. In files/
# but NOT listed on purpose: guardian-connect, tg-remote-test, ha-host-actions.py, odroid-remote-log, omp. The secret
# scan reads a docker-bridge address, a tailnet host name, an "sk-admin" string compare, a base64-looking URL and a
# cgroup path as findings; each file was read by hand and holds no credential, but `capture` would refuse its whole
# commit with them listed.
[capture]
include_files = [
  ".config/htop/htoprc",
  ".config/task-cli/config.yaml",
  ".config/hsw-editor/config.json",
  ".config/crypt-docs/deny-list.txt",
  ".config/tasks-backup/age.pub",
  ".config/user-dirs.dirs",
  ".config/git/config",
  ".config/git/attributes",
  ".config/xdg-desktop-portal/portals.conf",
  ".config/ralphex/agents/*.txt",
  ".config/ralphex/prompts/*.txt",
  ".config/ralphex/scripts/*.sh",
  ".local/bin/cf-mextner",
  ".local/bin/fj-login",
  ".local/bin/hsw-review",
  ".local/bin/omp-steer",
  ".cache/oh-my-posh/themes/jandedobbeleer.omp.json",
  ".local/bin/who-ran",
  ".local/bin/media-inhibit.sh",
  ".local/bin/tailnet-bind-exec",
]
machine_files = [
  ".config/monitors.xml",
  ".config/gtk-3.0/bookmarks",
  ".config/mimeapps.list",
  ".config/environment.d/50-omp.conf",
  ".bashrc",
  ".local/share/applications/hsw-review.desktop",
  ".local/share/applications/snapmaker-orca.desktop",
]


# ---------------------------------------------------------------------------------------------------------------
# Extra apt repositories (engine module `apt-sources`; spec docs/specs/apt-sources.md in ubuntu-tweaks).
#
# Every repository the laptop `home` used is DECLARED here once, with the primary-key fingerprint it is pinned to:
# a key is installed only if its fingerprint equals this one (checked with `gpg --show-keys`), never `apt-key`.
# Each fingerprint was computed from the laptop's keyring (`gpg --show-keys --with-colons`) and compared with the key the
# source's `key_url` serves: they were equal when this was written. `key_format` is how the key is STORED (asc:
# armored, gpg: binary); any channel may serve either form. Failover when a key URL is down: `key_urls` mirrors, then
# `key_cached`, a copy of the same key kept right here (public key; it must still match `fingerprint`); copies exist
# for the repositories a machine of this profile enables and for chatgpt, which has no vendor key URL.
#
# This file is the catalogue: every source is OFF here, and a machine opts in to the ones it needs with
# `[modules.apt-sources.sources.<name>] enabled = true` in machines/<host>/machine.toml, with the reason. A machine that
# says nothing gets no third-party repository.
[modules.apt-sources]
enabled = true

# Mozilla's own Firefox deb. Ubuntu's `firefox` is a transitional package that installs the snap; the pin makes the
# Mozilla deb win and hides Ubuntu's shim. Taken from the laptop (/etc/apt/preferences.d/mozilla). CHANGED against
# this PC's hand-written pin, which was `Package: *` from Mozilla at 1000: that would also pull any other Mozilla
# package; `firefox*` is all this repository carries. The module backs the old file up and replaces it. The key URL
# ends in `.gpg` but serves an armored key.
[modules.apt-sources.sources.mozilla]
enabled = false
uris = ["https://packages.mozilla.org/apt"]
suites = ["mozilla"]
components = ["main"]
key_url = "https://packages.mozilla.org/apt/repo-signing-key.gpg"
