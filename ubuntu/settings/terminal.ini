[ubuntu-tweak]
description = "Built-in terminal (Ptyxis): tab switching on Ctrl+Tab, as it was on the laptop"

[org/gnome/Ptyxis/Shortcuts]
# Tab switching on Ctrl+Tab, as on the laptop (and in Ghostty): the user's own setting, set in Ptyxis > Preferences > Shortcuts.
move-next-tab='<Control>Tab'
# Ctrl+Shift+Tab goes back, the other half of the same habit.
move-previous-tab='<Shift><Control>Tab'
