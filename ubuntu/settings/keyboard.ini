[org/gnome/desktop/input-sources]
sources=[('xkb', 'us'), ('xkb', 'ru')]

[org/gnome/desktop/wm/keybindings]
move-to-monitor-left=['<Super><Shift>Left', '<Control><Alt><Super>Left']
move-to-monitor-right=['<Super><Shift>Right', '<Control><Alt><Super>Right']
move-to-workspace-down=@as []
move-to-workspace-up=@as []
show-desktop=['<Primary><Super>d', '<Primary><Alt>d', '<Super>d']
switch-to-workspace-down=@as []
switch-to-workspace-left=['<Super>Page_Up', '<Super>KP_Prior', '<Super><Alt>Left']
switch-to-workspace-right=['<Super>Page_Down', '<Super>KP_Next', '<Super><Alt>Right']
switch-to-workspace-up=@as []

[org/gnome/mutter/keybindings]
toggle-tiled-left=@as []
toggle-tiled-right=@as []

[org/gnome/shell/extensions/tiling-assistant]
center-window=['<Control><Alt>c']
restore-window=['<Super>Down', '<Control><Alt>BackSpace']
tile-bottom-half=['<Super>KP_2', '<Control><Alt>Down']
tile-bottomleft-quarter=['<Super>KP_1', '<Control><Alt>j']
tile-bottomright-quarter=['<Super>KP_3', '<Control><Alt>k']
tile-left-half=['<Super>Left', '<Super>KP_4', '<Control><Alt>Left']
tile-maximize=['<Super>Up', '<Super>KP_5', '<Control><Alt>Return']
tile-maximize-vertically=['<Control><Alt><Shift>Up']
tile-right-half=['<Super>Right', '<Super>KP_6', '<Control><Alt>Right']
tile-top-half=['<Super>KP_8', '<Control><Alt>Up']
tile-topleft-quarter=['<Super>KP_7', '<Control><Alt>u']
tile-topright-quarter=['<Super>KP_9', '<Control><Alt>i']

[org/gnome/shell/keybindings]
toggle-message-tray=['<Super>m']
toggle-overview=['<Control><Alt>space']
