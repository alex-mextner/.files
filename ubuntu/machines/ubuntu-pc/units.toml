# systemd USER units this PC turns on in addition to ../../units.toml (see its header for the rule). Their files are in
# files/.config/systemd/user of this overlay: they came from the laptop with Linuxbrew paths, and the `90-pc.conf` and
# `95-pc-bind.conf` drop-ins next to them are what makes them run here.
#
# Linked but not listed:
#   glances.service            binds 0.0.0.0:61208 with no authentication; choose a loopback or tailnet bind first
#   odroid-remote-log.service  ~/.local/bin/odroid-remote-log is not in files/ on master (ubuntu/README.md says it is: the
#                              files PR did not carry it); it also needs the local ssh key to the ODROID
#   ha-host-actions.service    ~/.local/bin/ha-host-actions.py is not in files/ on master either; it reads the local token
#                              files restored per coverage.d/secrets.toml, and without them rejects every request
# Once the two scripts are in files/, list the two units here. They keep running on this PC.
# Tracked in https://github.com/alex-mextner/.files/issues/58.

# dc-mcp (module of the same name, issue #143): the OAuth proxy and the Cloudflare tunnel of this PC's ChatGPT connector. Listed here, not
# in the shared units.toml, because only a machine that already holds the Cloudflare credentials can run the tunnel unit; a new
# machine's `finish-setup --step dc-mcp-cloudflare` enables and starts all three.
enable = [
  "dc-mcp-bridge.service",
  "dc-mcp-shim.service",
  "dc-mcp-tunnel.service",
  # HSW editor preview on the tailnet (issue #183): files/.local/bin/hsw-editor-preview-refresh builds hsw-editor main from
  # GitHub into ~/.local/state/hsw-editor-preview (no local checkout needed). On a new machine the preview start is skipped
  # by its condition (so it shows pending) until the timer's first good build, which starts it. That build needs tailscale
  # logged in (the proxy binds the tailnet address); until then the refresh fails with exit 1 every 30 minutes.
  "hsw-editor-preview-refresh.timer",
  "hsw-editor-preview.service",
]
