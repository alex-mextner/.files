[org/gnome/desktop/remote-desktop/rdp]
# GNOME Remote Desktop is on for this PC. Only the switches are declared. The RDP login is kept by gnome-remote-desktop
# in the keyring and the TLS certificate and key are files; neither is stored here. A new machine needs the three steps
# of the secret rule in coverage.d/dconf.toml (TLS pair with openssl and `grdctl rdp set-tls-cert` / `set-tls-key`,
# then `grdctl rdp set-credentials`) before the service accepts a login.
enable=true
view-only=false
