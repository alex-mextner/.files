[org/gnome/desktop/remote-desktop/rdp]
# GNOME Remote Desktop is on for this PC. Only the switch is declared: the RDP user name, password and TLS certificate
# are credentials in the keyring and ~/.local/share/gnome-remote-desktop, set with `grdctl rdp set-credentials` and
# never stored here, so a new machine needs that one command before the service accepts a login.
enable=true
view-only=false
