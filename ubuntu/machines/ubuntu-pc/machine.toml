enabled = false

[modules.apt-sources.sources.protonvpn-stable]
# ProtonVPN is a laptop app, not installed here.
enabled = false

# Docker (engine module docker-daemon; spec docs/specs/docker-daemon.md in ubuntu-tweaks). Taken from the laptop
# (/etc/systemd/system/docker-limited.slice written by its mem-guard script, /etc/docker/daemon.json): every container
# in one memory-capped slice, `cgroup-parent: docker-limited.slice`, runtimes.nvidia. CHANGED for this PC: the
# laptop's MemoryHigh=6G MemoryMax=8G MemorySwapMax=1G are for a memory-starved machine; with 60 GB here 8 GB would
# kill ordinary builds, so containers may use about half the RAM (throttled from 24G, hard cap 32G, 4G of swap) and
# the desktop keeps at least 28 GB. The nvidia runtime stays "auto": it is written once `nvidia-container-runtime`
# exists on the machine (packages.toml installs nvidia-container-toolkit), never as a dead entry. A changed
# cgroup-parent only affects containers created afterwards; docker is reloaded, never restarted, by apply.
[modules.docker-daemon]
enabled = true
nvidia_runtime = "auto"
memory_high = "24G"
memory_max = "32G"
memory_swap_max = "4G"

# ---- finish-setup (ubuntu-tweak finish): the steps only the owner can do, in one list ----------------------------------------
# The engine's own steps (apply, icloud-signin, amo-key, firefox-backend-prompt) come from the modules; what is set here is
# what belongs to this PC alone.

# `apply` links the dock code of the hyperdock checkout into the shell. While a pull request of that repository is still
# open, the code on its branch is not the release, so applying now would link unfinished work: the gate prints the open pull
# requests (one line each, empty = go) and finish says WAIT with that list. A gate that cannot run (gh logged out, no
# network) is WAIT with the error, never a silent go.
[finish.apply]
gate = ["gh", "pr", "list", "--repo", "alex-mextner/hyperdock", "--state", "open", "--json", "number,title", "--jq", ".[] | \"#\\(.number) \\(.title)\""]
gate_why = "the dock code that apply links must be released first; these pull requests of hyperdock are still open"
gate_why_ru = "код дока, который подключает apply, сначала должен выйти релизом; эти pull request-ы hyperdock ещё открыты"

# Two scratch directories of finished ctmux work on the Hetzner build server (not git repositories, 137M and 424K). The
# server is reached as ultra@65.21.40.51 with the plain ssh key, it has no entry in ~/.ssh/config. Optional: leaving them
# costs disk space only, so they never keep finish-setup from reporting "all done". The script asks y/N before it removes
# anything and its two paths are literals (scripts/build-server-cleanup).
[[finish.steps]]
id = "build-server-cleanup"
title = "Remove two scratch directories from the build server"
title_ru = "Удалить два временных каталога на билд-сервере"
why = "finished ctmux work left /home/ultra/projects/rig-ctmux-20261023 and /home/ultra/projects/ubuntu-sync-ctmux-20261022 on ultra@65.21.40.51; deleting is the owner's call"
why_ru = "после завершённой работы над ctmux на ultra@65.21.40.51 остались /home/ultra/projects/rig-ctmux-20261023 и /home/ultra/projects/ubuntu-sync-ctmux-20261022; удалять их решаешь ты"
action = "Read the two paths and answer y to remove them"
action_ru = "Посмотри два пути и ответь y, чтобы удалить их"
check = ["./machines/ubuntu-pc/scripts/build-server-cleanup", "check"]
run = ["./machines/ubuntu-pc/scripts/build-server-cleanup", "run"]
optional = true

# The Ubuntu Dock (ubuntu-dock@ubuntu.com, schema org.gnome.shell.extensions.dash-to-dock) is switched off on this PC: it is
# in org.gnome.shell disabled-extensions and the engine's hyperdock module declares conflicts = ["ubuntu-dock@ubuntu.com"]
# and draws the dock instead (position, size and multi-monitor of the dock in use are keys of the hyperdock schema,
# modules/hyperdock/dock.ini in the engine). The retired dock keeps the dock-position BOTTOM it was given by hand, which
# has no effect now, so `capture` must not carry it into the shared settings (and `coverage` does not list it as untracked).
[capture]
exclude = ["/org/gnome/shell/extensions/dash-to-dock/dock-position"]

# ChatGPT to this PC's local tools (profile module dc-mcp, issue #143): Desktop Commander behind an OAuth proxy and the Cloudflare
# tunnel dc-local. ONE HOSTNAME PER MACHINE: a second machine must use its own hostname, never this one.
[modules.dc-mcp]
enabled = true
hostname = "dc-mcp.mextner.com"
tunnel = "dc-local"
