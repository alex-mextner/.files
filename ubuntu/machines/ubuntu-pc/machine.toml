# fingerprints, is in ../../profile.toml and every source is off there). This PC opts in to three and states why it
# declines the other six.
[modules.apt-sources.sources.mozilla]
# The Firefox deb installed here comes from this repository; it replaces the hand-written mozilla.list and its
# `Package: *` pin.
enabled = true

[modules.apt-sources.sources.tailscale]
# Tailscale is installed here; replaces the hand-written tailscale.list.
enabled = true

[modules.apt-sources.sources.nvidia-container-toolkit]
# RTX 4060 + the docker daemon below; the package itself is in packages.toml next to this file.
enabled = true

[modules.apt-sources.sources.docker]
# This PC runs Ubuntu's docker.io (active). Moving to docker-ce is replacing the engine, not toggling a
# repository: set enabled = true and install docker-ce yourself if you want that; the laptop's docker-ce stays its own.
enabled = false

[modules.apt-sources.sources.1password]
# 1Password is the snap here; the deb from this repository would install a second copy.
enabled = false

[modules.apt-sources.sources.google-chrome]
# Chrome is the rootless copy under ~/.local/opt (dpkg -x, see modules.chatgpt-guardian above): the apt repository
# would only add a root-installed Chrome next to it.
enabled = false

[modules.apt-sources.sources.claude-desktop]
# Claude Desktop is a laptop app, not installed here.
enabled = false

[modules.apt-sources.sources.chatgpt]
