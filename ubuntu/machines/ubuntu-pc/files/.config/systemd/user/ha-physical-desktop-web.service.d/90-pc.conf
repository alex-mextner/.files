# ubuntu-pc: bridges HA to a private VNC desktop that only exists with home's gnome-remote-desktop override
# (ha-private-desktop.conf, saved in ~/migration-from-home/backups/dropins/). That override would replace this PC's own RDP
# server, so it is NOT applied here; the bridge is skipped cleanly until the VNC socket exists. Its listen host/peer in
# ~/.config/ha-physical-desktop/bridge.env are also home's tailscale IP.
[Unit]
ConditionPathExists=/run/user/1000/ha-physical-desktop/vnc.sock
