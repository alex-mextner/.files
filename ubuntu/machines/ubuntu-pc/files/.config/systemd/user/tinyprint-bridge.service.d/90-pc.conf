# ubuntu-pc: bridge needs home's physical Bluetooth adapter (14:85:7F:CD:C2:50) and its bind address is home's tailscale IP
# (TINYPRINT_BRIDGE_BIND in ~/.config/tinyprint-bridge/bridge.env). Venv was rebuilt on system python.
# Skipped cleanly (not failed) while that adapter is absent; remove this file after plugging it in and fixing BIND.
[Service]
ExecCondition=/usr/bin/bash -c 'hciconfig -a 2>/dev/null | grep -qi 14:85:7F:CD:C2:50'
