# ubuntu-pc: no Linuxbrew; $$ escapes systemd's own variable substitution. The guard script is vendored in files/.local/bin: the checkout it used to run from (~/homeassistant) no longer exists, which made this unit exit 127 every minute.
[Service]
ExecStart=
ExecStart=/bin/bash -lc '%h/.local/bin/agent_browser_memory_guard.py; rc=$$?; if [ "$$rc" = 42 ]; then echo "agent-browser memory guard tripped"; PATH=%h/.local/bin:$$PATH agent-browser close --all || true; systemctl --user restart agent-browser.service; exit 0; fi; exit "$$rc"'
