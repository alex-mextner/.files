# ubuntu-pc: no Linuxbrew; $$ escapes systemd's own variable substitution
[Service]
ExecStart=
ExecStart=/bin/bash -lc '%h/homeassistant/scripts/agent_browser_memory_guard.py; rc=$$?; if [ "$$rc" = 42 ]; then echo "agent-browser memory guard tripped"; PATH=%h/.local/bin:$$PATH agent-browser close --all || true; systemctl --user restart agent-browser.service; exit 0; fi; exit "$$rc"'
