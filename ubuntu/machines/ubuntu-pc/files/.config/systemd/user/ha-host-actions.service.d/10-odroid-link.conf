# HA runs on the ODROID (odroidn2) and reaches this host's desktop actions over Tailscale by name:
# http://ubuntu-pc.tailbfe8ea.ts.net:8787 . The listener binds the tailnet interface address,
# resolved at start by tailnet-bind-exec (see 95-pc-bind.conf). Until tailscaled has the address the
# bind fails; Restart keeps retrying. Network-inventory routes are served by the ODROID's own copy.
[Unit]
StartLimitIntervalSec=0
After=tailscaled.service
[Service]
Restart=always
RestartSec=5
