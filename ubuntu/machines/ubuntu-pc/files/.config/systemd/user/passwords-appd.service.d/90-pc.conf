# ubuntu-pc: exit 1 = "io.github.alex_mextner.Passwords is already owned by another process" (passwords_app.daemon
# EX_ALREADY_RUNNING). Do not restart on it: another instance is alive and a restart loop would only fight it.
# Unreadable data / a locked keyring exit 75 (EX_TEMPFAIL) and ARE retried (Restart=always from
# 99-passkey-qr-selfheal.conf, RestartSec=5, no start limit).
[Service]
RestartPreventExitStatus=1
